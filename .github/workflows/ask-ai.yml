name: Ask AI

on:
  workflow_dispatch:

permissions:
  contents: read
  copilot-requests: write

jobs:
  ask-ai:
    runs-on: ubuntu-latest

    env:
      ACTIONS_STEP_DEBUG: true

    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6

      - name: AI Inference
        id: ai-response
        env:
          AZURE_AI_ENDPOINT: ${{ secrets.AZURE_AI_ENDPOINT }}
          AZURE_AI_KEY: ${{ secrets.AZURE_AI_KEY }}
          AZURE_AI_MODEL: ${{ secrets.AZURE_AI_MODEL }}
        run: |
          RESPONSE=$(curl -s \
            -X POST "${AZURE_AI_ENDPOINT}/openai/v1/responses" \
            -H "Content-Type: application/json" \
            -H "Authorization: Bearer ${AZURE_AI_KEY}" \
            -d "{
              \"model\": \"${AZURE_AI_MODEL}\",
              \"input\": \"Give me a programming joke.\"
            }")
      
          echo "$RESPONSE"
      
          CONTENT=$(echo "$RESPONSE" | jq -r '.output[0].content[0].text')
      
          {
            echo "response<<EOF"
            echo "$CONTENT"
            echo "EOF"
          } >> $GITHUB_OUTPUT
