name: Issue Completeness

on:
  issues:
    types: [opened]

permissions:
  models: read
  issues: write

jobs:
  analyze:
    name: AI Issue Completeness
    runs-on: ubuntu-latest
    steps:
      - name: Analyze issue with AI
        id: ai-response
        env:
          AZURE_AI_ENDPOINT: ${{ secrets.AZURE_AI_ENDPOINT }}
          AZURE_AI_KEY: ${{ secrets.AZURE_AI_KEY }}
          AZURE_AI_MODEL: ${{ secrets.AZURE_AI_MODEL }}

        run: |
          PROMPT=$(cat <<'EOF'
          New issue was opened by ${{ github.event.issue.user.login }}

          Title: ${{ github.event.issue.title }}

          Body:
          ---
          ${{ github.event.issue.body }}
          ---
          EOF
          )

          RESPONSE=$(jq -n \
            --arg model "$AZURE_AI_MODEL" \
            --arg input "$PROMPT" \
            '{
              model: $model,
              input: [
                {
                  role: "system",
                  content: "You are a GitHub issue assistant. Your task is to analyze newly opened issues for completeness. Provide concise, helpful suggestions, ask clarifying questions and identify any missing information that would help resolve the issue faster. Always respond with ready-to-use markdown content (no code blocks) that can be posted directly as an issue comment. Sign off as AI assistant."
                },
                {
                  role: "user",
                  content: $input
                }
              ]
            }')

          RESULT=$(curl -s \
            -X POST "${AZURE_AI_ENDPOINT}/openai/v1/responses" \
            -H "Content-Type: application/json" \
            -H "Authorization: Bearer ${AZURE_AI_KEY}" \
            -d "$RESPONSE")

          COMMENT=$(echo "$RESULT" | jq -r '.output[0].content[0].text')

          {
            echo "response<<EOF"
            echo "$COMMENT"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Comment results on the issue
        uses: peter-evans/create-or-update-comment@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          issue-number: ${{ github.event.issue.number }}
          body: ${{ steps.ai-response.outputs.response }}

